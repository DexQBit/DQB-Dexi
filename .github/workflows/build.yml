name: Build and Push to GHCR
on:
  push:
    tags: ["dqb-*"]
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: web
            dockerfile: apps/web/Dockerfile.web
          - service: space
            dockerfile: apps/space/Dockerfile.space
          - service: admin
            dockerfile: apps/admin/Dockerfile.admin
          - service: live
            dockerfile: apps/live/Dockerfile.live
          - service: backend
            dockerfile: apps/api/Dockerfile.api
          - service: proxy
            dockerfile: apps/proxy/Dockerfile.ce
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/DexQBit/DQB-Dexi-${{ matrix.service }}:${{ github.ref_name }}
